name: Build Validation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-trip-build:
    name: Frontend and Trip Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            trip/package-lock.json

      - name: Install Trip dependencies
        working-directory: trip
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build and sync Trip preview
        working-directory: frontend
        run: npm run build:trip-preview

      - name: Run frontend validation
        working-directory: frontend
        run: npm test

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tripsync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tripsync_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          DISABLE_SCHEDULER: "1"
          MOCK_AI: "1"
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tripsync_test
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tripsync_test
        run: python -m pytest -q

  backend-container-health:
    name: Backend Container Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build backend image
        working-directory: backend
        run: docker build -t tripsync-backend:ci .

      - name: Run backend container
        run: |
          docker rm -f tripsync-backend-ci >/dev/null 2>&1 || true
          docker run -d \
            --name tripsync-backend-ci \
            -p 8000:8000 \
            -e DISABLE_SCHEDULER=1 \
            -e MOCK_AI=1 \
            -e DATABASE_URL=postgresql+psycopg://postgres:postgres@127.0.0.1:5432/tripsync_ci \
            tripsync-backend:ci

          docker ps -a --filter name=tripsync-backend-ci

      - name: Verify backend health endpoint
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then
              echo
              echo "Backend container health check passed."
              exit 0
            fi

            echo "Waiting for backend container health check, attempt ${attempt}/30..."
            docker ps -a --filter name=tripsync-backend-ci
            sleep 2
          done

          echo "::error::Backend container did not become healthy."
          docker logs tripsync-backend-ci
          exit 1

      - name: Stop backend container
        if: always()
        run: docker stop tripsync-backend-ci || true
