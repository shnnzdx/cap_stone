name: Backend AI Secret Provision

on:
  workflow_dispatch:
    inputs:
      openai_api_key_parameter:
        description: "SSM SecureString parameter name for the OpenAI-compatible provider API key"
        required: true
        default: /tripsync/backend/prod/openai-api-key

permissions:
  contents: read

env:
  DB_PARAMETER_NAME: /tripsync/backend/prod/database-url
  EXECUTION_ROLE_NAME: tripsync-ecs-execution-role
  POLICY_NAME: tripsync-read-runtime-parameters

jobs:
  provision-ai-secret:
    name: Provision Backend AI Secret
    runs-on: ubuntu-latest
    environment: Main

    steps:
      - name: Enforce main branch for cloud operations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow may only run from the main branch. Re-run it from main."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check required GitHub environment secret
        shell: bash
        env:
          PRIMARY_AI_API_KEY: ${{ secrets.TRIPSYNC_AI_API_KEY }}
          LEGACY_OPENAI_API_KEY: ${{ secrets.TRIPSYNC_OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${PRIMARY_AI_API_KEY}" ]; then
            echo "Using preferred Main environment secret: TRIPSYNC_AI_API_KEY"
            exit 0
          fi

          if [ -n "${LEGACY_OPENAI_API_KEY}" ]; then
            echo "Using legacy Main environment secret: TRIPSYNC_OPENAI_API_KEY"
            exit 0
          fi

          echo "::error::Neither TRIPSYNC_AI_API_KEY nor TRIPSYNC_OPENAI_API_KEY is available in the Main environment secrets."
          echo "::error::Add TRIPSYNC_AI_API_KEY for new setups, or keep the legacy name until the secret is migrated."
          exit 1

      - name: Select effective GitHub environment secret
        id: secret
        shell: bash
        env:
          PRIMARY_AI_API_KEY: ${{ secrets.TRIPSYNC_AI_API_KEY }}
          LEGACY_OPENAI_API_KEY: ${{ secrets.TRIPSYNC_OPENAI_API_KEY }}
        run: |
          set -euo pipefail

          if [ -n "${PRIMARY_AI_API_KEY}" ]; then
            echo "selected_secret_name=TRIPSYNC_AI_API_KEY" >> "${GITHUB_OUTPUT}"
            printf 'effective_ai_api_key=%s\n' "${PRIMARY_AI_API_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -n "${LEGACY_OPENAI_API_KEY}" ]; then
            echo "selected_secret_name=TRIPSYNC_OPENAI_API_KEY" >> "${GITHUB_OUTPUT}"
            printf 'effective_ai_api_key=%s\n' "${LEGACY_OPENAI_API_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::No usable GitHub environment secret was available after selection."
          exit 1

      - name: Create or update AI provider SSM parameter
        id: ai
        shell: bash
        env:
          OPENAI_API_KEY_PARAMETER: ${{ inputs.openai_api_key_parameter }}
          EFFECTIVE_AI_API_KEY: ${{ steps.secret.outputs.effective_ai_api_key }}
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "${OPENAI_API_KEY_PARAMETER}" \
            --type SecureString \
            --value "${EFFECTIVE_AI_API_KEY}" \
            --overwrite >/dev/null

          OPENAI_API_KEY_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${OPENAI_API_KEY_PARAMETER}" \
            --query 'Parameter.ARN' \
            --output text)"

          echo "openai_api_key_parameter_arn=${OPENAI_API_KEY_PARAMETER_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Grant ECS execution role access to runtime parameters
        shell: bash
        env:
          OPENAI_API_KEY_PARAMETER_ARN: ${{ steps.ai.outputs.openai_api_key_parameter_arn }}
        run: |
          set -euo pipefail

          DATABASE_URL_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${DB_PARAMETER_NAME}" \
            --query 'Parameter.ARN' \
            --output text)"

          cat > /tmp/ecs-ssm-read-policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": "ssm:GetParameters",
                "Resource": [
                  "${DATABASE_URL_PARAMETER_ARN}",
                  "${OPENAI_API_KEY_PARAMETER_ARN}"
                ]
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name "${EXECUTION_ROLE_NAME}" \
            --policy-name "${POLICY_NAME}" \
            --policy-document file:///tmp/ecs-ssm-read-policy.json

      - name: Confirm parameter metadata
        shell: bash
        env:
          OPENAI_API_KEY_PARAMETER: ${{ inputs.openai_api_key_parameter }}
        run: |
          set -euo pipefail

          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=${OPENAI_API_KEY_PARAMETER}" \
            --query 'Parameters[0].{Name:Name,Type:Type}' \
            --output json
