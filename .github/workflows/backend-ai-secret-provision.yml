name: Backend AI Secret Provision

on:
  workflow_dispatch:
    inputs:
      deepseek_api_key_parameter:
        description: "SSM SecureString parameter name for the DeepSeek API key"
        required: true
        default: /tripsync/backend/prod/deepseek-api-key
      ollama_cloud_api_key_parameter:
        description: "SSM SecureString parameter name for the Ollama Cloud API key"
        required: true
        default: /tripsync/backend/prod/ollama-cloud-api-key
      geoapify_api_key_parameter:
        description: "SSM SecureString parameter name for the Geoapify API key"
        required: true
        default: /tripsync/backend/prod/geoapify-api-key

permissions:
  contents: read

env:
  DB_PARAMETER_NAME: /tripsync/backend/prod/database-url
  EXECUTION_ROLE_NAME: tripsync-ecs-execution-role
  POLICY_NAME: tripsync-read-runtime-parameters

jobs:
  provision-ai-secret:
    name: Provision Backend AI Secrets
    runs-on: ubuntu-latest
    environment: Main

    steps:
      - name: Enforce main branch for cloud operations
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "::error::This workflow may only run from the main branch. Re-run it from main."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Check required GitHub environment secrets
        shell: bash
        env:
          PRIMARY_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_DEEPSEEK_API_KEY }}
          FALLBACK_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_AI_API_KEY }}
          LEGACY_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_OPENAI_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.TRIPSYNC_OLLAMA_CLOUD_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.TRIPSYNC_GEOAPIFY_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${OLLAMA_CLOUD_API_KEY}" ]; then
            echo "::error::TRIPSYNC_OLLAMA_CLOUD_API_KEY is required in the Main environment secrets."
            exit 1
          fi

          if [ -z "${GEOAPIFY_API_KEY}" ]; then
            echo "::error::TRIPSYNC_GEOAPIFY_API_KEY is required in the Main environment secrets."
            exit 1
          fi

          if [ -n "${PRIMARY_DEEPSEEK_API_KEY}" ]; then
            echo "Using preferred Main environment secret: TRIPSYNC_DEEPSEEK_API_KEY"
            exit 0
          fi

          if [ -n "${FALLBACK_DEEPSEEK_API_KEY}" ]; then
            echo "Using temporary DeepSeek fallback secret: TRIPSYNC_AI_API_KEY"
            exit 0
          fi

          if [ -n "${LEGACY_DEEPSEEK_API_KEY}" ]; then
            echo "Using temporary DeepSeek legacy secret: TRIPSYNC_OPENAI_API_KEY"
            exit 0
          fi

          echo "::error::No DeepSeek secret is available in the Main environment secrets."
          echo "::error::Add TRIPSYNC_DEEPSEEK_API_KEY. TRIPSYNC_AI_API_KEY and TRIPSYNC_OPENAI_API_KEY remain temporary fallback names only."
          exit 1

      - name: Select effective GitHub environment secrets
        id: secret
        shell: bash
        env:
          PRIMARY_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_DEEPSEEK_API_KEY }}
          FALLBACK_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_AI_API_KEY }}
          LEGACY_DEEPSEEK_API_KEY: ${{ secrets.TRIPSYNC_OPENAI_API_KEY }}
          OLLAMA_CLOUD_API_KEY: ${{ secrets.TRIPSYNC_OLLAMA_CLOUD_API_KEY }}
          GEOAPIFY_API_KEY: ${{ secrets.TRIPSYNC_GEOAPIFY_API_KEY }}
        run: |
          set -euo pipefail

          printf 'ollama_cloud_api_key=%s\n' "${OLLAMA_CLOUD_API_KEY}" >> "${GITHUB_OUTPUT}"
          echo "ollama_cloud_secret_name=TRIPSYNC_OLLAMA_CLOUD_API_KEY" >> "${GITHUB_OUTPUT}"
          printf 'geoapify_api_key=%s\n' "${GEOAPIFY_API_KEY}" >> "${GITHUB_OUTPUT}"
          echo "geoapify_secret_name=TRIPSYNC_GEOAPIFY_API_KEY" >> "${GITHUB_OUTPUT}"

          if [ -n "${PRIMARY_DEEPSEEK_API_KEY}" ]; then
            echo "deepseek_secret_name=TRIPSYNC_DEEPSEEK_API_KEY" >> "${GITHUB_OUTPUT}"
            printf 'deepseek_api_key=%s\n' "${PRIMARY_DEEPSEEK_API_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -n "${FALLBACK_DEEPSEEK_API_KEY}" ]; then
            echo "deepseek_secret_name=TRIPSYNC_AI_API_KEY" >> "${GITHUB_OUTPUT}"
            printf 'deepseek_api_key=%s\n' "${FALLBACK_DEEPSEEK_API_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [ -n "${LEGACY_DEEPSEEK_API_KEY}" ]; then
            echo "deepseek_secret_name=TRIPSYNC_OPENAI_API_KEY" >> "${GITHUB_OUTPUT}"
            printf 'deepseek_api_key=%s\n' "${LEGACY_DEEPSEEK_API_KEY}" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          echo "::error::No usable DeepSeek GitHub environment secret was available after selection."
          exit 1

      - name: Create or update provider SSM parameters
        id: ai
        shell: bash
        env:
          DEEPSEEK_API_KEY_PARAMETER: ${{ inputs.deepseek_api_key_parameter }}
          OLLAMA_CLOUD_API_KEY_PARAMETER: ${{ inputs.ollama_cloud_api_key_parameter }}
          GEOAPIFY_API_KEY_PARAMETER: ${{ inputs.geoapify_api_key_parameter }}
          DEEPSEEK_API_KEY: ${{ steps.secret.outputs.deepseek_api_key }}
          OLLAMA_CLOUD_API_KEY: ${{ steps.secret.outputs.ollama_cloud_api_key }}
          GEOAPIFY_API_KEY: ${{ steps.secret.outputs.geoapify_api_key }}
        run: |
          set -euo pipefail

          aws ssm put-parameter \
            --name "${DEEPSEEK_API_KEY_PARAMETER}" \
            --type SecureString \
            --value "${DEEPSEEK_API_KEY}" \
            --overwrite >/dev/null

          aws ssm put-parameter \
            --name "${OLLAMA_CLOUD_API_KEY_PARAMETER}" \
            --type SecureString \
            --value "${OLLAMA_CLOUD_API_KEY}" \
            --overwrite >/dev/null

          aws ssm put-parameter \
            --name "${GEOAPIFY_API_KEY_PARAMETER}" \
            --type SecureString \
            --value "${GEOAPIFY_API_KEY}" \
            --overwrite >/dev/null

          DEEPSEEK_API_KEY_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${DEEPSEEK_API_KEY_PARAMETER}" \
            --query 'Parameter.ARN' \
            --output text)"

          OLLAMA_CLOUD_API_KEY_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${OLLAMA_CLOUD_API_KEY_PARAMETER}" \
            --query 'Parameter.ARN' \
            --output text)"

          GEOAPIFY_API_KEY_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${GEOAPIFY_API_KEY_PARAMETER}" \
            --query 'Parameter.ARN' \
            --output text)"

          echo "deepseek_api_key_parameter_arn=${DEEPSEEK_API_KEY_PARAMETER_ARN}" >> "${GITHUB_OUTPUT}"
          echo "ollama_cloud_api_key_parameter_arn=${OLLAMA_CLOUD_API_KEY_PARAMETER_ARN}" >> "${GITHUB_OUTPUT}"
          echo "geoapify_api_key_parameter_arn=${GEOAPIFY_API_KEY_PARAMETER_ARN}" >> "${GITHUB_OUTPUT}"

      - name: Grant ECS execution role access to runtime parameters
        shell: bash
        env:
          DEEPSEEK_API_KEY_PARAMETER_ARN: ${{ steps.ai.outputs.deepseek_api_key_parameter_arn }}
          OLLAMA_CLOUD_API_KEY_PARAMETER_ARN: ${{ steps.ai.outputs.ollama_cloud_api_key_parameter_arn }}
          GEOAPIFY_API_KEY_PARAMETER_ARN: ${{ steps.ai.outputs.geoapify_api_key_parameter_arn }}
        run: |
          set -euo pipefail

          DATABASE_URL_PARAMETER_ARN="$(aws ssm get-parameter \
            --name "${DB_PARAMETER_NAME}" \
            --query 'Parameter.ARN' \
            --output text)"

          cat > /tmp/ecs-ssm-read-policy.json <<JSON
          {
            "Version": "2012-10-17",
            "Statement": [
              {
                "Effect": "Allow",
                "Action": "ssm:GetParameters",
                "Resource": [
                  "${DATABASE_URL_PARAMETER_ARN}",
                  "${DEEPSEEK_API_KEY_PARAMETER_ARN}",
                  "${OLLAMA_CLOUD_API_KEY_PARAMETER_ARN}",
                  "${GEOAPIFY_API_KEY_PARAMETER_ARN}"
                ]
              }
            ]
          }
          JSON

          aws iam put-role-policy \
            --role-name "${EXECUTION_ROLE_NAME}" \
            --policy-name "${POLICY_NAME}" \
            --policy-document file:///tmp/ecs-ssm-read-policy.json

      - name: Confirm parameter metadata
        shell: bash
        env:
          DEEPSEEK_API_KEY_PARAMETER: ${{ inputs.deepseek_api_key_parameter }}
          OLLAMA_CLOUD_API_KEY_PARAMETER: ${{ inputs.ollama_cloud_api_key_parameter }}
          GEOAPIFY_API_KEY_PARAMETER: ${{ inputs.geoapify_api_key_parameter }}
        run: |
          set -euo pipefail

          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=${DEEPSEEK_API_KEY_PARAMETER}" \
            --query 'Parameters[0].{Name:Name,Type:Type}' \
            --output json

          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=${OLLAMA_CLOUD_API_KEY_PARAMETER}" \
            --query 'Parameters[0].{Name:Name,Type:Type}' \
            --output json

          aws ssm describe-parameters \
            --parameter-filters "Key=Name,Option=Equals,Values=${GEOAPIFY_API_KEY_PARAMETER}" \
            --query 'Parameters[0].{Name:Name,Type:Type}' \
            --output json
