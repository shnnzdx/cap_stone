<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Map Background</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f5f7fa;
        }
        
        .map-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        
        svg {
            display: block;
        }
    </style>
</head>
<body>
    <div class="map-container">
        <svg id="mapSvg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice" class="w-full h-full">
            <defs>
                <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f5f7fa"/>
                    <stop offset="100%" style="stop-color:#e4e9f0"/>
                </linearGradient>
                
                <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
                    <feGaussianBlur stdDeviation="4" result="blur"/>
                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>
            </defs>
            
            <rect width="1920" height="1080" fill="url(#bgGradient)"/>
            
            <g opacity="0.12" stroke="#a0aec0" stroke-width="1" fill="none">
                <line x1="0" y1="180" x2="1920" y2="200"/>
                <line x1="0" y1="380" x2="1920" y2="360"/>
                <line x1="0" y1="580" x2="1920" y2="600"/>
                <line x1="0" y1="780" x2="1920" y2="760"/>
                <line x1="0" y1="980" x2="1920" y2="1000"/>
                
                <line x1="200" y1="0" x2="220" y2="1080"/>
                <line x1="450" y1="0" x2="430" y2="1080"/>
                <line x1="700" y1="0" x2="720" y2="1080"/>
                <line x1="950" y1="0" x2="930" y2="1080"/>
                <line x1="1200" y1="0" x2="1220" y2="1080"/>
                <line x1="1450" y1="0" x2="1430" y2="1080"/>
                <line x1="1700" y1="0" x2="1720" y2="1080"/>
            </g>
            
            <g opacity="0.06" fill="#a0aec0">
                <ellipse cx="300" cy="250" rx="120" ry="80"/>
                <ellipse cx="1500" cy="750" rx="140" ry="100"/>
                <ellipse cx="900" cy="500" rx="100" ry="70"/>
            </g>
            
            <path id="routePath" d="M180,150 C350,220 450,320 600,380 C750,440 850,400 1000,480 C1150,560 1200,650 1380,700 C1520,740 1650,800 1780,900"
                  fill="none"/>
            
            <path id="routeAnimated" d="M180,150 C350,220 450,320 600,380 C750,440 850,400 1000,480 C1150,560 1200,650 1380,700 C1520,740 1650,800 1780,900"
                  stroke="#94a3b8" stroke-width="3.5" fill="none" stroke-linecap="round"
                  stroke-dasharray="2200" stroke-dashoffset="2200"/>
            
            <g id="waypoints"></g>
            
            <g id="travelDot" opacity="0">
                <circle r="7" fill="#94a3b8" opacity="0.35" filter="url(#softGlow)"/>
                <circle r="4" fill="#7c8fa3"/>
            </g>
        </svg>
    </div>

    <script>
        const routePath = document.getElementById('routePath');
        const routeAnimated = document.getElementById('routeAnimated');
        const travelDot = document.getElementById('travelDot');
        const waypointsGroup = document.getElementById('waypoints');
        
        const pathLength = routePath.getTotalLength();
        
        routeAnimated.style.strokeDasharray = pathLength;
        routeAnimated.style.strokeDashoffset = pathLength;
        
        const numWaypoints = 7;
        const waypointPositions = [];
        
        for (let i = 0; i < numWaypoints; i++) {
            const t = i / (numWaypoints - 1);
            const point = routePath.getPointAtLength(t * pathLength);
            waypointPositions.push({ x: point.x, y: point.y, t: t });
            
            const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
            g.setAttribute('transform', `translate(${point.x},${point.y})`);
            g.dataset.index = i;
            g.style.opacity = '0';
            
            const isEndpoint = i === 0 || i === numWaypoints - 1;
            
            const outer = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            outer.setAttribute('r', isEndpoint ? '16' : '12');
            outer.setAttribute('fill', '#a0aec0');
            outer.setAttribute('opacity', '0.18');
            
            const middle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            middle.setAttribute('r', isEndpoint ? '10' : '7');
            middle.setAttribute('fill', '#8898aa');
            middle.setAttribute('opacity', '0.85');
            
            const inner = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            inner.setAttribute('r', isEndpoint ? '5' : '3.5');
            inner.setAttribute('fill', '#f5f7fa');
            
            g.appendChild(outer);
            g.appendChild(middle);
            g.appendChild(inner);
            waypointsGroup.appendChild(g);
        }
        
        function easeInOut(t) {
            return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        }
        
        function animate() {
            const duration = 7000;
            const startTime = performance.now();
            
            function frame(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                const easedProgress = easeInOut(progress);
                
                const offset = pathLength * (1 - easedProgress);
                routeAnimated.style.strokeDashoffset = offset;
                
                if (progress > 0) {
                    travelDot.style.opacity = '1';
                    const point = routePath.getPointAtLength(easedProgress * pathLength);
                    travelDot.setAttribute('transform', `translate(${point.x},${point.y})`);
                }
                
                waypointPositions.forEach((pos, i) => {
                    const wp = waypointsGroup.children[i];
                    if (easedProgress >= pos.t - 0.02) {
                        const wpProgress = Math.min(1, (easedProgress - (pos.t - 0.02)) / 0.06);
                        wp.style.opacity = wpProgress;
                    }
                });
                
                if (progress < 1) {
                    requestAnimationFrame(frame);
                } else {
                    setTimeout(() => {
                        routeAnimated.style.transition = 'none';
                        routeAnimated.style.strokeDashoffset = pathLength;
                        travelDot.style.opacity = '0';
                        
                        Array.from(waypointsGroup.children).forEach(wp => {
                            wp.style.opacity = '0';
                        });
                        
                        routeAnimated.getBoundingClientRect();
                        requestAnimationFrame(animate);
                    }, 1800);
                }
            }
            
            requestAnimationFrame(frame);
        }
        
        setTimeout(animate, 400);
    </script>
</body>
</html>
