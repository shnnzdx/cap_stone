<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="A responsive SVG recreation of the animated security data pipeline diagram." />
  <title>Security Data Pipeline Animation</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="pipeline-card" aria-label="Animated security data pipeline">
      <div class="ambient-glow" aria-hidden="true"></div>

      <svg
        id="pipeline"
        class="pipeline-svg"
        viewBox="0 0 1600 520"
        role="img"
        aria-labelledby="diagram-title diagram-description"
        preserveAspectRatio="xMidYMid meet"
      >
        <title id="diagram-title">Security data pipeline animation</title>
        <desc id="diagram-description">
          Security events flow from multiple sources into a central ingest, reduce,
          normalize and route processor, then continue to multiple destinations.
        </desc>

        <defs>
          <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
            <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#17322a" flood-opacity="0.12" />
          </filter>

          <filter id="hubGlow" x="-100%" y="-100%" width="300%" height="300%">
            <feGaussianBlur stdDeviation="28" />
          </filter>

          <symbol id="icon-database" viewBox="0 0 24 24">
            <ellipse cx="12" cy="5" rx="7" ry="3"></ellipse>
            <path d="M5 5v5c0 1.7 3.1 3 7 3s7-1.3 7-3V5"></path>
            <path d="M5 10v5c0 1.7 3.1 3 7 3s7-1.3 7-3v-5"></path>
          </symbol>

          <symbol id="icon-cloud" viewBox="0 0 24 24">
            <path d="M7.5 18h9.2a4.3 4.3 0 0 0 .6-8.5A6 6 0 0 0 6.2 8.2 4.9 4.9 0 0 0 7.5 18Z"></path>
            <path d="m8.8 12 2 2 4-4"></path>
          </symbol>

          <symbol id="icon-shield" viewBox="0 0 24 24">
            <path d="M12 3 19 6v5c0 4.7-2.8 8.1-7 10-4.2-1.9-7-5.3-7-10V6l7-3Z"></path>
            <path d="M8.5 8.5 15.5 15.5"></path>
          </symbol>

          <symbol id="icon-window" viewBox="0 0 24 24">
            <rect x="4" y="5" width="16" height="14" rx="2"></rect>
            <path d="M4 9h16M7 7h.01M10 7h.01"></path>
          </symbol>

          <symbol id="icon-alert" viewBox="0 0 24 24">
            <path d="M12 3 21 19H3L12 3Z"></path>
            <path d="M12 9v4M12 16h.01"></path>
          </symbol>

          <symbol id="icon-audit" viewBox="0 0 24 24">
            <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9L12 3Z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </symbol>

          <symbol id="icon-grid" viewBox="0 0 24 24">
            <rect x="4" y="4" width="6" height="6" rx="1"></rect>
            <rect x="14" y="4" width="6" height="6" rx="1"></rect>
            <rect x="4" y="14" width="6" height="6" rx="1"></rect>
            <rect x="14" y="14" width="6" height="6" rx="1"></rect>
          </symbol>

          <symbol id="icon-diamond" viewBox="0 0 24 24">
            <path d="m12 3 7 9-7 9-7-9 7-9Z"></path>
            <path d="M12 8v8"></path>
          </symbol>

          <symbol id="icon-check" viewBox="0 0 24 24">
            <path d="m7 12 3 3 7-7"></path>
          </symbol>
        </defs>

        <g class="wires" aria-hidden="true">
          <path id="input-path-0" class="wire" d="M365 70 H500 C570 70 575 220 690 220 H742" />
          <path id="input-path-1" class="wire" d="M365 135 H465 C535 135 520 250 645 250 H742" />
          <path id="input-path-2" class="wire" d="M365 195 H485 C540 195 540 240 640 240 H742" />
          <path id="input-path-3" class="wire" d="M365 255 H742" />
          <path id="input-path-4" class="wire" d="M365 315 H470 C535 315 545 270 645 270 H742" />
          <path id="input-path-5" class="wire" d="M365 375 H470 C555 375 535 286 655 286 H742" />
          <path id="input-path-6" class="wire" d="M365 435 H470 C545 435 575 300 680 300 H742" />

          <path id="output-path-0" class="wire" d="M950 255 H1035 C1095 255 1120 70 1180 70 H1254" />
          <path id="output-path-1" class="wire" d="M950 255 H1045 C1100 255 1120 155 1180 155 H1254" />
          <path id="output-path-2" class="wire" d="M950 255 H1254" />
          <path id="output-path-3" class="wire" d="M950 255 H1045 C1100 255 1120 345 1180 345 H1254" />
          <path id="output-path-4" class="wire" d="M950 255 H1035 C1095 255 1120 435 1180 435 H1254" />
        </g>

        <g class="sources">
          <g class="source" transform="translate(210 50)">
            <rect width="155" height="40" rx="20"></rect>
            <use href="#icon-database" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">ANY SOURCE</text>
            <circle class="port" cx="158" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(210 115)">
            <rect width="155" height="40" rx="20"></rect>
            <use href="#icon-cloud" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">CLOUD LOGS</text>
            <circle class="port" cx="158" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(165 175)">
            <rect width="200" height="40" rx="20"></rect>
            <use href="#icon-shield" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">VULNERABILITIES</text>
            <circle class="port" cx="203" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(192 235)">
            <rect width="173" height="40" rx="20"></rect>
            <use href="#icon-window" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">IAM ACTIVITY</text>
            <circle class="port" cx="176" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(210 295)">
            <rect width="155" height="40" rx="20"></rect>
            <use href="#icon-alert" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">EDR ALERTS</text>
            <circle class="port" cx="158" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(165 355)">
            <rect width="200" height="40" rx="20"></rect>
            <use href="#icon-audit" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">SAAS AUDIT LOGS</text>
            <circle class="port" cx="203" cy="20" r="2"></circle>
          </g>
          <g class="source" transform="translate(165 415)">
            <rect width="200" height="40" rx="20"></rect>
            <use href="#icon-grid" x="12" y="11" width="18" height="18"></use>
            <text x="38" y="25">ASSET INVENTORY</text>
            <circle class="port" cx="203" cy="20" r="2"></circle>
          </g>
        </g>

        <g class="destinations">
          <g class="destination" transform="translate(1254 50)">
            <rect width="80" height="40" rx="20"></rect>
            <text x="40" y="25" text-anchor="middle">SIEM</text>
          </g>
          <g class="destination" transform="translate(1254 135)">
            <rect width="170" height="40" rx="20"></rect>
            <text x="85" y="25" text-anchor="middle">CLOUD STORAGE</text>
          </g>
          <g class="destination" transform="translate(1254 235)">
            <rect width="72" height="40" rx="20"></rect>
            <text x="36" y="25" text-anchor="middle">XDR</text>
          </g>
          <g class="destination" transform="translate(1254 325)">
            <rect width="120" height="40" rx="20"></rect>
            <text x="60" y="25" text-anchor="middle">DATA LAKE</text>
          </g>
          <g class="destination" transform="translate(1254 415)">
            <rect width="185" height="40" rx="20"></rect>
            <text x="92.5" y="25" text-anchor="middle">ANY DESTINATION</text>
          </g>
        </g>

        <g class="hub" aria-hidden="true">
          <circle class="hub-aura hub-aura--green" cx="835" cy="255" r="115"></circle>
          <circle class="hub-aura hub-aura--yellow" cx="835" cy="285" r="95"></circle>

          <g class="process process--top">
            <rect x="797" y="157" width="76" height="76" rx="17" transform="rotate(45 835 195)"></rect>
            <text x="835" y="191" text-anchor="middle">REDUCE</text>
          </g>
          <g class="process process--left">
            <rect x="734" y="217" width="76" height="76" rx="17" transform="rotate(45 772 255)"></rect>
            <text x="772" y="259" text-anchor="middle">INGEST</text>
          </g>
          <g class="process process--right">
            <rect x="860" y="217" width="76" height="76" rx="17" transform="rotate(45 898 255)"></rect>
            <text x="898" y="259" text-anchor="middle">ROUTE</text>
          </g>
          <g class="process process--bottom">
            <rect x="797" y="277" width="76" height="76" rx="17" transform="rotate(45 835 315)"></rect>
            <text x="835" y="319" text-anchor="middle">NORMALIZE</text>
          </g>

          <g class="core" filter="url(#softShadow)">
            <rect x="794" y="214" width="82" height="82" rx="18" transform="rotate(45 835 255)"></rect>
            <g class="spinner-position" transform="translate(835 255)">
              <g class="spinner">
              <circle cx="0" cy="-28" r="4"></circle>
              <circle cx="14" cy="-24.2" r="4"></circle>
              <circle cx="24.2" cy="-14" r="4"></circle>
              <circle cx="28" cy="0" r="4"></circle>
              <circle cx="24.2" cy="14" r="4"></circle>
              <circle cx="14" cy="24.2" r="4"></circle>
              <circle cx="0" cy="28" r="4"></circle>
              <circle cx="-14" cy="24.2" r="4"></circle>
              <circle cx="-24.2" cy="14" r="4"></circle>
              <circle cx="-28" cy="0" r="4"></circle>
              <circle cx="-24.2" cy="-14" r="4"></circle>
              <circle cx="-14" cy="-24.2" r="4"></circle>
              </g>
            </g>
          </g>
        </g>

        <g id="packet-layer" aria-hidden="true"></g>
      </svg>

      <button id="motion-toggle" class="motion-toggle" type="button" aria-pressed="false">
        Pause animation
      </button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
